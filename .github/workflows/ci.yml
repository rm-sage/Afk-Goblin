name: CI

on:
  push:
    # bolt-migration is where the work happens; main is the pre-Bolt history.
    # Without it here a branch push ran no checks at all, and 34 commits reached
    # the remote having never been validated by anything but a local run.
    branches: [main, bolt-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # LUAJIT, NOT lua5.4, AND THE DIFFERENCE COST A PLAY SESSION.
      #
      # Bolt's plugin host is LuaJIT 2.1 -- Lua 5.1 semantics. Confirmed from the
      # shipped binary: bolt.exe exports lua_getfenv, lua_setfenv, lua_objlen and
      # lua_cpcall, all removed after 5.1, exports none of lua_rotate,
      # lua_absindex or lua_isinteger, and carries the banners "Lua 5.1" and
      # "LuaJIT 2.1.1716656478".
      #
      # This step used to run luac5.4, which ACCEPTS everything 5.1 accepts and
      # more -- so it passed `//`, `~` and `&` in lua/detect/buffs.lua, all of
      # them Lua 5.3 additions and all of them syntax errors on the host. The
      # plugin stopped the instant it was enabled, and the only symptom was the
      # enable toggle flipping itself back off. A checker more permissive than
      # the runtime is worse than none: it converts a startup failure into
      # confidence.
      #
      # `npm test` runs the Lua layer in a real VM (tests/lua/) but that VM is
      # wasmoon, which is 5.4 -- so it has the same blind spot by construction.
      # tests/lua/dialect.test.ts guards the dialect at source level for fast
      # feedback; THIS is the authoritative check, and it covers the vendored
      # submodules too.
      - name: Install LuaJIT and zstd
        run: sudo apt-get update && sudo apt-get install -y luajit zstd
      - name: Byte-compile every Lua file with the dialect Bolt runs
        run: |
          luajit -v
          status=0
          while IFS= read -r -d '' f; do
            if ! luajit -bl "$f" /dev/null; then
              echo "::error file=$f::not valid Lua 5.1 / LuaJIT — see tests/lua/dialect.test.ts"
              status=1
            fi
          done < <(find . -name '*.lua' -not -path './node_modules/*' -print0)
          exit $status

      - name: Package and describe the release
        id: package
        run: |
          version=$(node -p "require('./bolt.json').version")
          mkdir -p pages
          tarball="afk-goblin-v${version}.tar.zst"
          # The repo root is already the plugin layout -- bolt.json, main.lua,
          # lua/ and the built app/ -- so there is nothing to assemble. Bolt
          # expects bolt.json at the archive root, hence the explicit file list
          # rather than tarring a wrapper directory.
          tar --zstd -cf "pages/${tarball}" \
            bolt.json main.lua lua app $([ -d modules ] && echo modules)
          sha=$(sha256sum "pages/${tarball}" | cut -d' ' -f1)
          # This host path is the GitHub Pages URL, derived from the REPOSITORY
          # name — keep it in step with any future repo rename.
          node -e "
            const fs = require('fs');
            fs.writeFileSync('pages/meta.json', JSON.stringify({
              sha256: '${sha}',
              version: '${version}',
              url: 'https://rm-sage.github.io/Afk-Goblin/${tarball}',
            }));
          "
          cat pages/meta.json

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: pages

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
