name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The Lua layer cannot be unit-tested -- it only runs inside the game
      # process -- so a syntax check is the one automated guarantee available.
      # Without it a typo ships and only surfaces as a dead plugin in-game.
      - name: Install Lua and zstd
        run: sudo apt-get update && sudo apt-get install -y lua5.4 zstd
      - name: Syntax-check every Lua file
        run: find . -name '*.lua' -not -path './node_modules/*' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Package and describe the release
        id: package
        run: |
          version=$(node -p "require('./bolt.json').version")
          mkdir -p pages
          tarball="afk-goblin-v${version}.tar.zst"
          # The repo root is already the plugin layout -- bolt.json, main.lua,
          # lua/ and the built app/ -- so there is nothing to assemble. Bolt
          # expects bolt.json at the archive root, hence the explicit file list
          # rather than tarring a wrapper directory.
          tar --zstd -cf "pages/${tarball}" \
            bolt.json main.lua lua app $([ -d modules ] && echo modules)
          sha=$(sha256sum "pages/${tarball}" | cut -d' ' -f1)
          # NOTE: this host path is the GitHub Pages URL, which is derived from
          # the REPOSITORY name, not the project name. It stays AfkUAV until the
          # GitHub repo itself is renamed; update it in the same change.
          node -e "
            const fs = require('fs');
            fs.writeFileSync('pages/meta.json', JSON.stringify({
              sha256: '${sha}',
              version: '${version}',
              url: 'https://rm-sage.github.io/AfkUAV/${tarball}',
            }));
          "
          cat pages/meta.json

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: pages

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
